<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deriv Digit Match Analyzer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #9aa4b2;
  margin-bottom: 20px;
}

.card {
  background: #111722;
  border: 1px solid #293242;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 15px;
}

label {
  display: block;
  color: #aeb7c5;
  margin-bottom: 7px;
}

select,
button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 0;
  font-size: 16px;
}

select {
  background: #1b2330;
  color: white;
  margin-bottom: 12px;
}

button {
  background: #00c853;
  color: white;
  font-weight: bold;
}

.status {
  text-align: center;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 15px;
  background: #171d28;
}

.green {
  color: #00e676;
}

.yellow {
  color: #ffd740;
}

.red {
  color: #ff5252;
}

.signal {
  text-align: center;
  background: #151c29;
  border-radius: 14px;
  padding: 20px;
}

.signalDigit {

  font-weight: bold;
  margin: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);

.stat {
  background: #171e2b;

}

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;

.digit {
  background: #171e2b;
  border-radius: 9px;
  text-align: center;
  padding: 10px 3px;
}

.digitNumber {
  font-size: 20px;
  font-weight: bold;
}

.small {
  color: #9ca3af;
  font-size: 11px;
}

.recent {
  line-height: 2;

.error {
  color: #ff5252;
  font-size: 13px;
  margin-top: 12px;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>Deriv Digit Match Analyzer</h1>

<div class="subtitle">
Live Volatility Index Analysis
</div>

<div class="card">

<label>Select Market</label>

<select id="market">

<option value="1HZ100V">
Volatility 100 Index
</option>

<option value="1HZ75V">
Volatility 75 Index
</option>

<option value="1HZ50V">
Volatility 50 Index
</option>

<option value="1HZ25V">
Volatility 25 Index
</option>

<option value="1HZ10V">
Volatility 10 Index
</option>

</select>

<button id="analyze">
ANALYZE
</button>

</div>

<div id="status" class="status yellow">
Ready — press ANALYZE
</div>

<div class="card signal">

<div>BEST MATCH CANDIDATE</div>

<div id="signalDigit" class="signalDigit">
-
</div>

<div id="score" class="score">
Waiting for live ticks
</div>

</div>

<div class="card">

<div class="grid">

<div class="stat">
<div class="statTitle">Market</div>
<div id="marketName" class="statValue">-</div>
</div>

<div class="stat">
<div class="statTitle">Ticks</div>
<div id="tickCount" class="statValue">0</div>
</div>

<div class="stat">
<div class="statTitle">Last Price</div>
<div id="lastPrice" class="statValue">-</div>
</div>

<div class="stat">
<div class="statTitle">Last Digit</div>
<div id="lastDigit" class="statValue">-</div>
</div>

<div class="stat">
<div class="statTitle">Current Gap</div>
<div id="gap" class="statValue">-</div>
</div>

<div class="stat">
<div class="statTitle">Average Jump</div>
<div id="jump" class="statValue">-</div>
</div>

</div>

</div>

<div class="card">

<h3>Digit Matches</h3>

<div id="digits" class="digits"></div>

</div>

<div class="card">

<h3>Recent Digits</h3>

<div id="recent" class="recent">
-
</div>

<div id="error" class="error"></div>

</div>

</div>


<script>

let socket = null;

let symbol = "1HZ100V";

let digitList = [];

let priceList = [];

let counts = new Array(10).fill(0);

let lastSeen = new Array(10).fill(-1);

let reconnectTimer = null;

let reconnectAttempts = 0;

const MAX_TICKS = 500;


/* =========================
   STATUS
========================= */

function setStatus(text, type) {

  const el =
    document.getElementById("status");

  el.textContent = text;

  el.className =
    "status " + type;

}


function setError(text) {

  document.getElementById("error").textContent =
    text || "";

}


/* =========================
   RESET
========================= */

function resetAnalyzer() {

  digitList = [];

  priceList = [];

  counts = new Array(10).fill(0);

  lastSeen = new Array(10).fill(-1);

  document.getElementById("tickCount").textContent = "0";

  document.getElementById("lastPrice").textContent = "-";

  document.getElementById("lastDigit").textContent = "-";

  document.getElementById("gap").textContent = "-";

  document.getElementById("jump").textContent = "-";

  document.getElementById("signalDigit").textContent = "-";

  document.getElementById("score").textContent =
    "Waiting for live ticks";

  document.getElementById("recent").textContent = "-";

  setError("");

  renderDigits();

}


/* =========================
   CONNECT
========================= */

function connect() {

  if (socket) {

    try {
      socket.close();
    } catch (e) {}

  }

  clearTimeout(reconnectTimer);

  setStatus(
    "Connecting to Deriv...",
    "yellow"
  );

  setError("");


  /*
    This is the public WebSocket
    endpoint shown in Deriv's
    official browser examples.
  */

  socket = new WebSocket(
    "wss://ws.binaryws.com/websockets/v3"
  );


  socket.onopen = function() {

    reconnectAttempts = 0;

    setStatus(
      "Connected — receiving live ticks",
      "green"
    );


    /*
      Direct tick subscription.

      No login.
      No token.
      No App ID.
      No backend.
    */

    socket.send(
      JSON.stringify({

        ticks: symbol,

        subscribe: 1,

        req_id: 1

      })
    );


    /*
      Also request recent history
      to populate the analyzer faster.
    */

    socket.send(
      JSON.stringify({

        ticks_history: symbol,

        count: 100,

        end: "latest",

        style: "ticks",

        req_id: 2

      })
    );

  };


  socket.onmessage = function(event) {

    let data;

    try {

      data =
        JSON.parse(event.data);

    } catch (e) {

      return;

    }


    /*
      Show the REAL Deriv error.
    */

    if (data.error) {

      setStatus(
        "Deriv returned an error",
        "red"
      );

      setError(
        data.error.message ||
        JSON.stringify(data.error)
      );

      return;

    }


    /*
      Historical data.
    */

    if (
      data.msg_type === "history" &&
      data.history
    ) {

      const prices =
        data.history.prices || [];

      for (
        let i = 0;
        i < prices.length;
        i++
      ) {

        processTick(
          prices[i],
          false
        );

      }

      return;

    }


    /*
      Live tick.
    */

    if (
      data.msg_type === "tick" &&
      data.tick
    ) {

      processTick(
        data.tick.quote,
        true
      );

    }

  };


  socket.onerror = function() {

    setStatus(
      "WebSocket connection error",
      "red"
    );

    setError(
      "Your browser/network could not establish the Deriv WebSocket connection."
    );

  };


  socket.onclose = function() {

    setStatus(
      "Connection closed — reconnecting...",
      "red"
    );


    /*
      Automatically reconnect.
    */

    reconnectAttempts++;

    const delay =
      Math.min(
        5000 * reconnectAttempts,
        15000
      );


    clearTimeout(reconnectTimer);

    reconnectTimer =
      setTimeout(
        connect,
        delay
      );

  };

}


/* =========================
   PROCESS TICK
========================= */

function processTick(
  quote,
  live
) {

  const price =
    Number(quote);

  if (
    !Number.isFinite(price)
  ) {

    return;

  }


  /*
    Deriv's Volatility Index
    quote normally contains decimal
    places.

    We take the final displayed
    decimal digit.
  */

  const text =
    String(quote);

  let digit;


  if (
    text.includes(".")
  ) {

    const decimals =
      text.split(".")[1];

    if (
      decimals &&
      decimals.length > 0
    ) {

      digit =
        Number(
          decimals[
            decimals.length - 1
          ]
        );

    }

  }


  /*
    Fallback.
  */

  if (
    !Number.isInteger(digit) ||
    digit < 0 ||
    digit > 9
  ) {

    digit =
      Math.abs(
        Math.round(price * 100)
      ) % 10;

  }


  digitList.push(digit);

  priceList.push(price);

  counts[digit]++;

  lastSeen[digit] =
    digitList.length - 1;


  /*
    Keep only the newest
    500 ticks.
  */

  if (
    digitList.length >
    MAX_TICKS
  ) {

    const removed =
      digitList.shift();

    counts[removed]--;

    lastSeen =
      new Array(10).fill(-1);

    for (
      let i = 0;
      i < digitList.length;
      i++
    ) {

      lastSeen[
        digitList[i]
      ] = i;

    }

  }


  if (
    priceList.length >
    MAX_TICKS
  ) {

    priceList.shift();

  }


  updateScreen();

}


/* =========================
   UPDATE SCREEN
========================= */

function updateScreen() {

  document.getElementById(
    "tickCount"
  ).textContent =
    digitList.length;


  if (priceList.length) {

    document.getElementById(
      "lastPrice"
    ).textContent =
      priceList[
        priceList.length - 1
      ];

  }


  if (digitList.length) {

    document.getElementById(
      "lastDigit"
    ).textContent =
      digitList[
        digitList.length - 1
      ];

  }


  calculateGap();

  calculateJump();

  renderDigits();

  renderRecent();

  calculateSignal();

}


/* =========================
   GAP
========================= */

function calculateGap() {

  if (!digitList.length) {
    return;
  }

  const lastDigit =
    digitList[
      digitList.length - 1
    ];

  const gap =
    digitList.length -
    1 -
    lastSeen[lastDigit];

  document.getElementById(
    "gap"
  ).textContent =
    gap;

}


/* =========================
   JUMP
========================= */

function calculateJump() {

  if (
    priceList.length < 2
  ) {

    document.getElementById(
      "jump"
    ).textContent = "-";

    return;

  }


  let total = 0;

  let number = 0;

  const start =
    Math.max(
      1,
      priceList.length - 100
    );


  for (
    let i = start;
    i < priceList.length;
    i++
  ) {

    total +=
      Math.abs(
        priceList[i] -
        priceList[i - 1]
      );

    number++;

  }


  document.getElementById(
    "jump"
  ).textContent =
    (total / number).toFixed(5);

}


/* =========================
   DIGIT TABLE
========================= */

function renderDigits() {

  const box =
    document.getElementById(
      "digits"
    );

  box.innerHTML = "";


  const total =
    digitList.length;


  for (
    let d = 0;
    d <= 9;
    d++
  ) {

    const percent =
      total
        ? (
            counts[d] /
            total *
            100
          )
        : 0;


    const item =
      document.createElement(
        "div"
      );

    item.className =
      "digit";


    item.innerHTML =

      "<div class='digitNumber'>" +
      d +
      "</div>" +

      "<div>" +
      counts[d] +
      " matches" +
      "</div>" +

      "<div class='small'>" +
      percent.toFixed(1) +
      "%</div>";


    box.appendChild(item);

  }

}


/* =========================
   RECENT DIGITS
========================= */

function renderRecent() {

  const recent =
    digitList.slice(-30);


  document.getElementById(
    "recent"
  ).textContent =
    recent.length
      ? recent.join(" • ")
      : "-";

}


/* =========================
   MATCH SIGNAL
========================= */

function calculateSignal() {

  if (
    digitList.length < 30
  ) {

    document.getElementById(
      "signalDigit"
    ).textContent =
      "-";

    document.getElementById(
      "score"
    ).textContent =
      "Collecting ticks: " +
      digitList.length +
      "/30";

    return;

  }


  const total =
    digitList.length;

  const recent =
    digitList.slice(-50);

  let results = [];


  for (
    let d = 0;
    d <= 9;
    d++
  ) {

    /*
      Overall frequency.
    */

    const overall =
      counts[d] / total;


    /*
      Recent frequency.
    */

    let recentCount = 0;

    for (
      const value of recent
    ) {

      if (value === d) {
        recentCount++;
      }

    }


    const recentFrequency =
      recentCount /
      recent.length;


    /*
      Gap.
    */

    let gap;

    if (
      lastSeen[d] === -1
    ) {

      gap = total;

    } else {

      gap =
        total -
        1 -
        lastSeen[d];

    }


    /*
      Statistical ranking only.
      It is NOT a guaranteed
      prediction probability.
    */

    const frequencyScore =
      Math.min(
        Math.abs(
          overall - 0.10
        ) * 500,
        1
      );


    const recentScore =
      Math.min(
        Math.abs(
          recentFrequency - 0.10
        ) * 500,
        1
      );


    const gapScore =
      Math.min(
        gap / 50,
        1
      );


    const score =
      frequency
